<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Illustration de produits alimentaires de première nécessité">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8ef"/>
      <stop offset="1" stop-color="#f0dfc0"/>
    </linearGradient>
    <linearGradient id="sac" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6e7c8"/>
      <stop offset="1" stop-color="#dfc492"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d14"/>
      <stop offset="1" stop-color="#18110c"/>
    </linearGradient>
    <linearGradient id="huile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b84b"/>
      <stop offset="1" stop-color="#b9811f"/>
    </linearGradient>
    <pattern id="grains" width="18" height="18" patternUnits="userSpaceOnUse">
      <ellipse cx="5" cy="5" rx="2.2" ry="4" fill="#b99155" opacity="0.35" transform="rotate(-25 5 5)"/>
      <ellipse cx="13" cy="13" rx="2" ry="3.6" fill="#b99155" opacity="0.25" transform="rotate(20 13 13)"/>
    </pattern>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#18110c" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#fond)"/>
  <circle cx="880" cy="250" r="250" fill="#e6c77c" opacity="0.28"/>
  <circle cx="880" cy="250" r="310" fill="none" stroke="#c99535" stroke-width="1" opacity="0.45"/>
  <path d="M90 0v760" stroke="#c99535" stroke-width="1" opacity="0.6"/>
  <path d="M0 610h1200" stroke="#c99535" stroke-width="1" opacity="0.35"/>
  <g opacity="0.22" stroke="#6e6255" stroke-width="1" fill="none">
    <path d="M120 180c120-70 240-70 360 0M120 220c120-70 240-70 360 0"/>
    <path d="M950 570c70-45 140-45 210 0"/>
  </g>

  <rect x="0" y="612" width="1200" height="148" fill="url(#table)"/>
  <path d="M0 626h1200" stroke="#c99535" stroke-width="1" opacity="0.4"/>

  <g filter="url(#ombre)">
    <!-- Sac de riz -->
    <g transform="translate(170 190)">
      <path d="M66 66h108l14 36-8 20 30 300H46l30-300-8-20 14-36Z" fill="url(#sac)" stroke="#8a6f49" stroke-width="2"/>
      <path d="M66 66c14-16 30-24 54-24s40 8 54 24l14 36c-22 14-44 20-68 20s-46-6-68-20l14-36Z" fill="#eedbb4" stroke="#8a6f49" stroke-width="2"/>
      <path d="M96 44c6-18 12-28 24-28s18 10 24 28" fill="none" stroke="#8a6f49" stroke-width="3"/>
      <path d="M58 160h124M52 300h136" stroke="#b18e57" stroke-width="2" opacity="0.55"/>
      <path d="M66 66h108l14 36-8 20 30 300H46l30-300-8-20 14-36Z" fill="url(#grains)"/>
      <rect x="96" y="190" width="48" height="74" fill="#fbf6ec" opacity="0.75"/>
      <path d="M108 212h24M108 224h24M112 236h16" stroke="#8a6f49" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- Bidon d'huile -->
    <g transform="translate(470 250)">
      <path d="M38 42h116l14 22v250a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16V64l14-22Z" fill="url(#huile)" stroke="#8a5f17" stroke-width="2"/>
      <path d="M62 42V18h68v24" fill="none" stroke="#8a5f17" stroke-width="4"/>
      <rect x="86" y="2" width="30" height="18" rx="3" fill="#8a5f17"/>
      <path d="M24 110h144v96H24z" fill="#fbf6ec" opacity="0.9"/>
      <circle cx="96" cy="158" r="28" fill="none" stroke="#8a5f17" stroke-width="2"/>
      <path d="M96 138c10 12 14 18 14 24a14 14 0 0 1-28 0c0-6 4-12 14-24Z" fill="#c99535"/>
      <path d="M46 250h100" stroke="#8a5f17" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- Sac de farine -->
    <g transform="translate(700 220)">
      <path d="M54 58h120l16 32-6 24 24 268H40l24-268-6-24 16-32Z" fill="url(#sac)" stroke="#8a6f49" stroke-width="2"/>
      <path d="M54 58c12-14 28-20 60-20s48 6 60 20l16 32c-22 12-48 18-76 18s-54-6-76-18l16-32Z" fill="#f6ecd6" stroke="#8a6f49" stroke-width="2"/>
      <path d="M40 382h152" stroke="#8a6f49" stroke-width="3"/>
      <circle cx="114" cy="190" r="34" fill="#fbf6ec" opacity="0.7"/>
      <path d="M96 190h36M114 172v36" stroke="#8a6f49" stroke-width="2" opacity="0.55"/>
      <g fill="#b99155" opacity="0.3">
        <circle cx="78" cy="272" r="3"/><circle cx="148" cy="268" r="3"/><circle cx="112" cy="310" r="3"/>
      </g>
    </g>

    <!-- Petit sac de sucre -->
    <g transform="translate(940 300)">
      <path d="M30 52h96l10 24-4 16 18 206H16l18-206-4-16 10-24Z" fill="#f6e7c8" stroke="#8a6f49" stroke-width="2"/>
      <path d="M30 52h96l10 24H20l10-24Z" fill="#e9d2a5" stroke="#8a6f49" stroke-width="2"/>
      <g fill="#fbf6ec" stroke="#b18e57" stroke-width="1.5">
        <rect x="42" y="126" width="26" height="24"/><rect x="76" y="126" width="26" height="24"/>
        <rect x="42" y="158" width="26" height="24"/><rect x="76" y="158" width="26" height="24"/>
      </g>
    </g>

    <!-- Oignons -->
    <g transform="translate(980 540)" stroke="#8a6f49" stroke-width="2">
      <path d="M20 60c-16-20-6-44 12-44 4-14 10-20 14-20s10 6 14 20c18 0 28 24 12 44-10 14-34 14-44 0Z" fill="#e5c98f"/>
      <path d="M40 16c-10 16-10 32 0 44M46 16c10 16 10 32 0 44M20 60c10 6 16 8 20 8s10-2 20-8"/>
      <path d="M112 64c-12-16-4-34 10-34 4-12 8-16 12-16s8 4 12 16c14 0 22 18 10 34-8 12-26 12-36 0Z" fill="#d8b16f"/>
      <path d="M134 14c-8 12-8 26 0 36M140 14c8 12 8 26 0 36"/>
    </g>

    <!-- Grains au sol -->
    <g fill="#c99535" opacity="0.45">
      <ellipse cx="120" cy="660" rx="3" ry="6" transform="rotate(-28 120 660)"/>
      <ellipse cx="150" cy="690" rx="3" ry="6" transform="rotate(18 150 690)"/>
      <ellipse cx="330" cy="668" rx="3" ry="6" transform="rotate(-12 330 668)"/>
      <ellipse cx="660" cy="700" rx="3" ry="6" transform="rotate(24 660 700)"/>
      <ellipse cx="830" cy="672" rx="3" ry="6" transform="rotate(-20 830 672)"/>
      <ellipse cx="1100" cy="700" rx="3" ry="6" transform="rotate(14 1100 700)"/>
    </g>
  </g>
</svg>
